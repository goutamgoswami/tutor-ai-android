name: Build Play Store Production AAB
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Force Clean Package Manager Mirrors
        run: |
          # Cleans up corrupt package data and forces Ubuntu to ignore broken third-party repo links
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -o Acquire::Check-Valid-Until=false -o Acquire::AllowInsecureRepositories=true || true

      - name: Install System Dependencies
        run: |
          # Uses target commands while ignoring broken external dependencies
          sudo apt-get install -y --allow-unauthenticated git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-venv libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build Production AAB Bundle
        run: |
          buildozer -v android release
        env:
          APP_ANDROID_RELEASE_KEYSTORE: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
          APP_ANDROID_RELEASE_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_ANDROID_RELEASE_KEYALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          APP_ANDROID_RELEASE_KEYALIAS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload Play Store Ready Artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release-bundle
          path: bin/*.aab
