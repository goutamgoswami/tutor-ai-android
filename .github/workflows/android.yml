name: Build Play Store Production AAB
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fix Broken GitHub Runner Dependencies
        run: |
          sudo apt-get remove -y libunwind-* || true
          sudo apt-get clean
          sudo apt-get update

      - name: Install System Tools
        run: |
          sudo apt-get install -y --no-install-recommends git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-venv libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" cython

      - name: Manually Pre-Install Google Command Line Tools
        run: |
          # Creates the official structure that bypasses obsolete layout checks
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses

          # Download and unpack the modern Google developer tools bundle
          wget https://google.com -O cmdline.zip
          unzip -q cmdline.zip
          
          mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools cmdline.zip

          # Inject current, legal Google license hash approvals directly
          echo -e "244d2d04b411f5d6f00f41a3d3a35c82b6bbf946\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n45f640d047a0714faab02f232467d3cd2f2ef4b4\n851659a721777d0a4b3419b1b413e554d79e3797" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build Production AAB Bundle
        run: |
          # This variable explicitly bypasses the obsolete "tools/bin/sdkmanager" search check
          export ANDROID_EXTERNAL_CMDLINE_TOOLS=~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          buildozer -v android release
        env:
          APP_ANDROID_RELEASE_KEYSTORE: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
          APP_ANDROID_RELEASE_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_ANDROID_RELEASE_KEYALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          APP_ANDROID_RELEASE_KEYALIAS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload Play Store Ready Artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release-bundle
          path: bin/*.aab
