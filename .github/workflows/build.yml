name: Build Alumni Tutor AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libsqlite3-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37"

      - name: Install Android SDK into Buildozer directory
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Installing SDK into:"
          echo "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip

          unzip -q \
            /tmp/cmdline-tools.zip \
            -d "$SDK/cmdline-tools"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android Build Tools and API
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify SDK and AIDL
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "======================================"
          echo "SDK DIRECTORY"
          echo "======================================"

          ls -lah "$SDK"

          echo ""
          echo "======================================"
          echo "BUILD TOOLS"
          echo "======================================"

          ls -lah "$SDK/build-tools"

          echo ""
          echo "======================================"
          echo "AIDL"
          echo "======================================"

          find "$SDK/build-tools" -type f -name aidl -print

          echo ""
          echo "Testing AIDL:"

          "$SDK/build-tools/34.0.0/aidl" --version

      - name: Configure Buildozer SDK path
        run: |
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"

      - name: Build Android AAB
        run: |
          buildozer -v android release

      - name: Show output
        if: always()
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          ls -lah bin/ || true

          echo ""
          find bin -type f -name "*.aab" -print || true

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alumni-Tutor-AI-AAB
          path: bin/*.aab
          if-no-files-found: error
