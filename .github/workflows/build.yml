name: Build Alumni Tutor AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libsqlite3-dev \
            libltdl-dev \
            gettext \
            autopoint

      - name: Install Android SDK
        shell: bash
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          echo "Downloading Android command line tools..."

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/android-cmdline-tools.zip

          echo "Extracting Android command line tools..."

          unzip -q \
            /tmp/android-cmdline-tools.zip \
            -d "$SDK/cmdline-tools"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          echo "$SDK"

          echo ""
          echo "Build tools:"

          ls -lah "$SDK/build-tools"

          echo ""
          echo "AIDL:"

          find "$SDK/build-tools" \
            -name aidl \
            -type f \
            -print

          echo ""
          echo "AIDL version:"

          "$SDK/build-tools/34.0.0/aidl" --version

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37"

      - name: Show environment
        run: |

          python --version
          buildozer --version
          cython --version
          java -version

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer
          rm -rf bin

          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

      - name: Restore Android SDK after clean
        shell: bash
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          # The SDK was installed before Buildozer clean.
          # Re-create the Buildozer SDK link.

          rm -rf "$SDK"

          mkdir -p "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build Android AAB
        shell: bash
        run: |

          buildozer -v android release

      - name: Show build output
        if: always()
        run: |

          echo "================================"
          echo "BIN DIRECTORY"
          echo "================================"

          ls -lah bin/ || true

          echo ""
          echo "AAB FILES"

          find bin \
            -type f \
            -name "*.aab" \
            -print || true

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alumni-Tutor-AI-AAB
          path: bin/*.aab
          if-no-files-found: error
