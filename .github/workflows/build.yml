```yaml
name: Build Alumni Tutor AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # LINUX DEPENDENCIES
      # --------------------------------------------------

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libsqlite3-dev \
            libltdl-dev \
            gettext \
            autopoint


      # --------------------------------------------------
      # PYTHON BUILD ENVIRONMENT
      # --------------------------------------------------

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37"


      # --------------------------------------------------
      # SHOW ENVIRONMENT
      # --------------------------------------------------

      - name: Show build environment
        run: |

          python --version
          pip --version
          buildozer --version
          cython --version
          java -version


      # --------------------------------------------------
      # CLEAN OLD BUILD
      # --------------------------------------------------

      - name: Clean Buildozer environment
        run: |

          rm -rf .buildozer
          rm -rf bin


      # --------------------------------------------------
      # BUILD ANDROID AAB
      # --------------------------------------------------

      - name: Build Android App Bundle
        run: |

          buildozer -v android release


      # --------------------------------------------------
      # SHOW OUTPUT
      # --------------------------------------------------

      - name: Show generated files
        if: always()
        run: |

          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          ls -lah bin/ || true

          echo ""
          echo "======================================"
          echo "AAB FILES"
          echo "======================================"

          find bin -type f -name "*.aab" -print || true


      # --------------------------------------------------
      # UPLOAD AAB
      # --------------------------------------------------

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alumni-Tutor-AI-AAB
          path: bin/*.aab
          if-no-files-found: error
```
