name: Build Alumni Tutor AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libsqlite3-dev \
            libltdl-dev \
            gettext \
            autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0" "cython==0.29.37"

      - name: Show build environment
        run: |
          python --version
          pip --version
          buildozer --version
          cython --version
          java -version

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Android AAB
        run: |
          buildozer -v android release

      - name: Show generated files
        if: always()
        run: |
          echo "Build output:"
          ls -lah bin/ || true
          echo "AAB files:"
          find bin -type f -name "*.aab" -print || true

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alumni-Tutor-AI-AAB
          path: bin/*.aab
          if-no-files-found: error
